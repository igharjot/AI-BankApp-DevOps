name: CI - Security Scanning

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:

  # ============================================================
  # GATE 1: SECRET SCANNING (Gitleaks)
  # ============================================================
  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Gitleaks needs full history to scan all commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # GATE 2: LINT - Java Checkstyle
  # ============================================================
  lint:
    name: Lint - Checkstyle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check || true # Audit mode for now to avoid blocking on style

  # ============================================================
  # GATE 3: SAST - Static Application Security Testing
  # ============================================================
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: [gitleaks, lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets

  # ============================================================
  # GATE 4: SCA - Software Composition Analysis
  # ============================================================
  # NOTE: Migrated from OWASP Dependency-Check to Trivy. OWASP relies on the
  # NVD REST API, which requires an NVD API key and is frequently rate-limited
  # or unavailable. Trivy ships its own vulnerability database (pulled from
  # GHCR), so it needs no NVD API key and does not depend on NVD availability.
  sca:
    name: SCA - Trivy
    runs-on: ubuntu-latest
    needs: [gitleaks, lint]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy dependency scan (gate)
        uses: aquasecurity/trivy-action@v0.28.0
        env:
          # Authenticated pulls of the Trivy DB from GHCR avoid anonymous rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'            # fail the build on findings (security gate)
          severity: HIGH,CRITICAL   # equivalent intent to failBuildOnCVSS=7
          ignore-unfixed: true      # only fail on vulnerabilities that have a fix

      - name: Generate Trivy report (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@v0.28.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sca-report
          path: trivy-results.sarif
